##############
# RBAC Add-on #
##############

# The BAMOE RBAC Add-on exposes GET /me returning the roles and permissions of the authenticated user.
# Requires: OIDC enabled (Security section above) + bamoe-addons-quarkus-rbac dependency.
#
# Available permissions:
#   process-definitions:view, process-definitions:execute
#   process-instances:view, process-instances:update
#   jobs:view, jobs:update
#   tasks:view, tasks:update, tasks:impersonate
#   pim:view, pim:update
#
# %prod.bamoe.rbac.permissions.<role>=<permission1>,<permission2>,...

# Allow specific roles to impersonate other users in User Task operations.
# kogito.security.auth.impersonation.allowed-for-roles has no effect unless
# kogito.security.auth.enabled is set to true. When it is missing, tasks:impersonate is still
# reported by /me and any authenticated user can read another user's tasks.
# %prod.kogito.security.auth.enabled=true
# %prod.kogito.security.auth.impersonation.allowed-for-roles=<role1>,<role2>,...

# %prod.quarkus.http.auth.policy.<policy-name>.roles-allowed=<role1>,<role2>,...
# %prod.quarkus.http.auth.permission.<permission-name>.paths=<path1>,<path2>,...
# %prod.quarkus.http.auth.permission.<permission-name>.methods=GET,POST,DELETE
# %prod.quarkus.http.auth.permission.<permission-name>.policy=<policy-name>

# When true, the add-on validates each granted permission against the route security at /me: a
# permission whose matching route is not secured for the user's role is filtered out of the /me
# response. Define named role policies and apply them to the protected routes:
# %prod.bamoe.rbac.validation.enabled=false


####################
# RBAC Data-Index  #
####################

# The BAMOE RBAC Data-Index Add-on enforces role guards on the GraphQL endpoint (/graphql).
# Requires: bamoe-addons-quarkus-rbac-data-index dependency.
#
# Syntax: %prod.bamoe.data-index.<OperationName>.roles=<role1>,<role2>,...
#
# Query operations:
# %prod.bamoe.data-index.ProcessInstances.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.ProcessDefinitions.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstances.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.Jobs.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.CountProcessInstances.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.CountProcessDefinitions.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.CountUserTaskInstances.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.CountJobs.roles=<role1>,<role2>,...
#
# Mutation operations — process-instances:update:
# %prod.bamoe.data-index.ProcessInstanceAbort.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.ProcessInstanceRetry.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.ProcessInstanceSkip.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.ProcessInstanceUpdateVariables.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.ProcessInstanceRescheduleSlaTimer.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.NodeInstanceTrigger.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.NodeInstanceCancel.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.NodeInstanceRetrigger.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.NodeInstanceRescheduleSlaTimer.roles=<role1>,<role2>,...
#
# Mutation operations — jobs:update:
# %prod.bamoe.data-index.JobCancel.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.JobReschedule.roles=<role1>,<role2>,...
#
# Mutation operations — tasks:update:
# %prod.bamoe.data-index.UserTaskInstanceUpdate.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstanceCommentCreate.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstanceCommentUpdate.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstanceCommentDelete.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstanceAttachmentCreate.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstanceAttachmentUpdate.roles=<role1>,<role2>,...
# %prod.bamoe.data-index.UserTaskInstanceAttachmentDelete.roles=<role1>,<role2>,...
