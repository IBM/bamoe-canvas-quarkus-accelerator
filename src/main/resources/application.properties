###################
# Security :: Dev #
###################

%dev.quarkus.devservices.enabled=false
%dev.quarkus.kogito.devservices.enabled=false
%dev.kogito.auth.enabled=false
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc-proxy.enabled=false
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
# This parameter accepts a list of hosts OR a regex that matches the host of an URL
# The Regex matches the 'host' part of an URL, everything from the beginning until the first forward slash
# e.g. for "dev-deployment-y0gy8a2810.apps.rm2.thpm.p1.openshiftapps.com/q/dev-ui" it will match "dev-deployment-y0gy8a2810.apps.rm2.thpm.p1.openshiftapps.com"
%dev.quarkus.dev-ui.hosts=^([^/]+)*(/.+)?$


##########################
# Event-driven Workflows #
##########################

# Kafka configuration (learn more at https://quarkus.io/guides/kafka)
# kafka.bootstrap.servers=<TODO>

# Incoming messages (uncomment for Start and Intermediate Catch Events of type Message)
#
# mp.messaging.incoming.<YOUR_CHANNEL_NAME>.connector=smallrye-kafka
# mp.messaging.incoming.<YOUR_CHANNEL_NAME>.group.id=<YOUR_GROUP_ID> # Defaults to `${quarkus.application.name}`
# mp.messaging.incoming.<YOUR_CHANNEL_NAME>.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# mp.messaging.incoming.<YOUR_CHANNEL_NAME>.auto.offset.reset=earliest
# mp.messaging.incoming.<YOUR_CHANNEL_NAME>.failure-strategy=ignore

# Outgoing messages (uncomment for End and Intermediate Throw Events of type Message)
#
# mp.messaging.outgoing.<YOUR_CHANNEL_NAME>.connector=smallrye-kafka
# mp.messaging.outgoing.<YOUR_CHANNEL_NAME>.group.id=<YOUR_GROUP_ID> # Defaults to `${quarkus.application.name}`
# mp.messaging.outgoing.<YOUR_CHANNEL_NAME>.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# By default, '<YOUR_CHANNEL_NAME>' will match the names of your Message Events in BPMN.
# '<YOUR_CHANNEL_NAME>' also defaults to your Kafka Topic's name, but you can change this behavior if you want to decouple your BPMN from your Kafka configuration by using this property:
#
# mp.messaging.incoming.<YOUR_CHANNEL_NAME>.topic=<YOUR_TOPIC_NAME>
#
# In this case, '<YOUR_CHANNEL_NAME>' will be the name of your Message Events in BPMN, and '<YOUR_TOPIC_NAME>' will be the name of your Kafka Topic.


