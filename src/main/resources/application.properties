##############
# RBAC Add-on #
##############

# The BAMOE RBAC Add-on exposes GET /me returning the roles and permissions of the authenticated user.
# Requires: security enabled (kogito.auth.enabled=true) + bamoe-addons-spring-boot-rbac dependency.
#
# Available permissions:
#   process-definitions:view, process-definitions:execute
#   process-instances:view, process-instances:update
#   jobs:view, jobs:update
#   tasks:view, tasks:update, tasks:impersonate
#   pim:view, pim:update
#
# bamoe.rbac.permissions.<role>=<permission1>,<permission2>,...

# Allow specific roles to impersonate other users in User Task operations.
# kogito.security.auth.impersonation.allowed-for-roles has no effect unless
# kogito.security.auth.enabled is set to true. When it is missing, tasks:impersonate is still
# reported by /me and any authenticated user can read another user's tasks.
# kogito.security.auth.enabled=true
# kogito.security.auth.impersonation.allowed-for-roles=<role1>,<role2>,...

# Spring Security does not read application roles or the login name from the token by default, so
# no role is recognised until the JWT is mapped. See BamoeSpringBootWebSecurityConfig.java.

# To restrict routes by role, extend the authorizeHttpRequests() chain in BamoeSpringBootWebSecurityConfig.java:
#
#   .authorizeHttpRequests(auth -> auth
#       .requestMatchers("/your/path").hasAnyAuthority("<role1>", "<role2>")
#       ...)

# When true, the add-on validates the /me permissions and drops any that aren't enforceable. On
# Spring Boot only the tasks:impersonate cross-check runs, because route security is defined in
# code (BamoeSpringBootWebSecurityConfig.java) and cannot be read back to validate route alignment.
# bamoe.rbac.validation.enabled=false


####################
# RBAC Data-Index  #
####################

# The BAMOE RBAC Data-Index Add-on enforces role guards on the GraphQL endpoint (/graphql).
# Requires: bamoe-addons-spring-boot-rbac-data-index dependency.
#
# Syntax: bamoe.data-index.<OperationName>.roles=<role1>,<role2>,...
#
# Query operations:
# bamoe.data-index.ProcessInstances.roles=<role1>,<role2>,...
# bamoe.data-index.ProcessDefinitions.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstances.roles=<role1>,<role2>,...
# bamoe.data-index.Jobs.roles=<role1>,<role2>,...
# bamoe.data-index.CountProcessInstances.roles=<role1>,<role2>,...
# bamoe.data-index.CountProcessDefinitions.roles=<role1>,<role2>,...
# bamoe.data-index.CountUserTaskInstances.roles=<role1>,<role2>,...
# bamoe.data-index.CountJobs.roles=<role1>,<role2>,...
#
# Mutation operations — process-instances:update:
# bamoe.data-index.ProcessInstanceAbort.roles=<role1>,<role2>,...
# bamoe.data-index.ProcessInstanceRetry.roles=<role1>,<role2>,...
# bamoe.data-index.ProcessInstanceSkip.roles=<role1>,<role2>,...
# bamoe.data-index.ProcessInstanceUpdateVariables.roles=<role1>,<role2>,...
# bamoe.data-index.ProcessInstanceRescheduleSlaTimer.roles=<role1>,<role2>,...
# bamoe.data-index.NodeInstanceTrigger.roles=<role1>,<role2>,...
# bamoe.data-index.NodeInstanceCancel.roles=<role1>,<role2>,...
# bamoe.data-index.NodeInstanceRetrigger.roles=<role1>,<role2>,...
# bamoe.data-index.NodeInstanceRescheduleSlaTimer.roles=<role1>,<role2>,...
#
# Mutation operations — jobs:update:
# bamoe.data-index.JobCancel.roles=<role1>,<role2>,...
# bamoe.data-index.JobReschedule.roles=<role1>,<role2>,...
#
# Mutation operations — tasks:update:
# bamoe.data-index.UserTaskInstanceUpdate.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstanceCommentCreate.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstanceCommentUpdate.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstanceCommentDelete.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstanceAttachmentCreate.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstanceAttachmentUpdate.roles=<role1>,<role2>,...
# bamoe.data-index.UserTaskInstanceAttachmentDelete.roles=<role1>,<role2>,...
